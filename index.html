    <script>
      // If loaded under Apache/WAMP/XAMPP/cPanel (port 80, 443, or standard non-dev server)
      if (typeof window !== 'undefined') {
        var port = window.location.port;
        if (port !== '3000' && port !== '5173' && (window.location.protocol === 'http:' || window.location.protocol === 'https:')) {
          // Instantly redirect to index.php so Apache never gets stuck on uncompiled TSX
          window.location.replace('index.php' + window.location.search + window.location.hash);
        }
      }
    </script>
